# Render Blueprint for the backend only: the API (web service) and the job-queue worker it
# depends on for every LLM call. The frontend deploys to Vercel from source (see web/README.md)
# — Vercel does not read this file and does not run web/Dockerfile.
#
# `dockerContext: ./backend` matters on top of `dockerfilePath`: without it Render uploads the
# whole monorepo (web/, docs/, node_modules once installed locally, etc.) as build context on
# every deploy, which is slow on the free tier for no reason — backend/Dockerfile only ever
# needs backend/.
#
# After the first deploy: set CORS_ORIGINS below to the real Vercel URL (a wildcard/staging
# value here would open the API to any origin), and fill in the `sync: false` secrets in the
# Render dashboard — they are intentionally not committed here.

databases:
  - name: understudy-db
    plan: free
    region: singapore
    # Render's free Postgres plan expires after 90 days and is not renewable in place — fine for
    # an assignment review window, not for anything meant to outlive it.

services:
  - type: web
    name: understudy-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    numInstances: 1
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: understudy-db
          property: connectionString
      # Update to the deployed Vercel URL after the first frontend deploy.
      - key: CORS_ORIGINS
        value: https://understudy.vercel.app
      - key: SOURCING_PROVIDER
        value: fixtures
      - key: CHANNEL
        value: manual
      # Secrets — set these in the Render dashboard, not here. Every one of them is optional:
      # the app boots and reports reduced capability without them (GET /healthz).
      - key: HUNAR_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PDL_API_KEY
        sync: false
      - key: DEMO_ALLOWED_NUMBERS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false

  # Claims and executes BackgroundJob rows (compile_jd, regenerate_personas, propose_patch,
  # rehearse) — see app/worker.py and app/services/background_jobs.py. Without this service,
  # every one of those returns 202 and then sits PENDING forever: nothing is polling the queue.
  # Same image as the web service, just a different start command and no HTTP port/health check.
  # Only needs an LLM key and the database — it never touches Hunar, sourcing, or CORS.
  #
  # Render's free tier has historically only covered Web Services and Static Sites, not
  # Background Workers — if `plan: free` isn't offered for this service type when you deploy,
  # this one service needs at least Starter.
  - type: worker
    name: understudy-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m app.worker
    plan: free
    region: singapore
    numInstances: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: understudy-db
          property: connectionString
      - key: NVIDIA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
