# Render Blueprint for the backend only. The frontend deploys to Vercel from source (see
# web/README.md) — Vercel does not read this file and does not run web/Dockerfile.
#
# One service, not two: a free-tier Render workspace rejects a `type: worker` service outright
# ("service type is not available for this plan"), so RUN_WORKER_INLINE=true below runs
# app/worker.py's poll loop as a background task inside the API process itself (see
# app/main.py's lifespan) instead of as a separate service. If you're on a plan that supports
# Background Workers, prefer splitting it back out — see git history for the two-service version
# (a `type: worker` block, same image, `dockerCommand: python -m app.worker`, without
# RUN_WORKER_INLINE) — a dedicated worker isn't tied to the API process's own restarts/sleep.
#
# `dockerContext: ./backend` matters on top of `dockerfilePath`: without it Render uploads the
# whole monorepo (web/, docs/, node_modules once installed locally, etc.) as build context on
# every deploy, which is slow on the free tier for no reason — backend/Dockerfile only ever
# needs backend/.
#
# After the first deploy: set CORS_ORIGINS below to the real Vercel URL (a wildcard/staging
# value here would open the API to any origin), and fill in the `sync: false` secrets in the
# Render dashboard — they are intentionally not committed here.

databases:
  - name: understudy-db
    plan: free
    region: singapore
    # Render's free Postgres plan expires after 90 days and is not renewable in place — fine for
    # an assignment review window, not for anything meant to outlive it.

services:
  - type: web
    name: understudy-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    numInstances: 1
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: RUN_WORKER_INLINE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: understudy-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://understudy-hunar.vercel.app
      - key: SOURCING_PROVIDER
        value: fixtures
      - key: CHANNEL
        value: manual
      # Secrets — set these in the Render dashboard, not here. Every one of them is optional:
      # the app boots and reports reduced capability without them (GET /healthz) — except that
      # with RUN_WORKER_INLINE, at least one LLM key is what makes compile/rehearse/personas/
      # patches actually run instead of sitting PENDING (same requirement a separate worker
      # service would have had).
      - key: HUNAR_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PDL_API_KEY
        sync: false
      - key: DEMO_ALLOWED_NUMBERS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
